<!doctype html><html lang="am"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>የመንጃ ፈተና ኩዊዝ 7</title><style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap');*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#e9f5ff,#f6f9fc);color:#172033;font-family:"Noto Sans Ethiopic",Arial,sans-serif}.card{width:min(100%,720px);padding:clamp(24px,5vw,44px);background:#fff;border-radius:22px;box-shadow:0 18px 50px #1d3e6326}h1{margin:0 0 8px;color:#123e72;font-size:clamp(1.4rem,4vw,2rem)}.muted{margin:0;color:#596579}.bar{height:8px;margin:22px 0 28px;background:#e8edf3;border-radius:9px;overflow:hidden}.bar div{height:100%;background:#2382d7;transition:.25s}.question{margin:18px 0;font-size:clamp(1.15rem,3vw,1.45rem);line-height:1.7}.options{display:grid;gap:12px}.option{padding:16px 18px;border:2px solid #dce5ef;border-radius:12px;background:#fff;color:#172033;text-align:left;font:inherit;font-size:1rem;cursor:pointer}.option:hover:not(:disabled){border-color:#2382d7;background:#f2f8ff}.option:disabled{cursor:default}.correct{border-color:#1d9a63;background:#eaf8f1;color:#08633a}.wrong{border-color:#d65050;background:#fff0f0;color:#a32424}.feedback{min-height:30px;margin:18px 0 0;font-weight:600}.good{color:#087244}.bad{color:#b22b2b}.next{float:right;margin-top:14px;padding:12px 22px;border:0;border-radius:10px;background:#176fbd;color:#fff;font:inherit;font-weight:600;cursor:pointer}.hidden{display:none}.clear{clear:both}.result{text-align:center}.result h2{color:#123e72}.result p{font-size:1.2rem}</style></head><body><main class="card" aria-live="polite"><section id="quiz"><h1>የመንጃ ፈተና ኩዊዝ 7</h1><p class="muted">እያንዳንዱን ጥያቄ በተናጠል ይመልሱ።</p><div class="bar"><div id="bar"></div></div><p id="progress" class="muted"></p><h2 id="question" class="question"></h2><div id="options" class="options"></div><p id="feedback" class="feedback"></p><button id="next" class="next hidden"></button><div class="clear"></div></section><section id="result" class="result hidden"><h2>ኩዊዙን ጨርሰዋል!</h2><p id="score"></p><button id="restart" class="next">እንደገና ጀምር</button><div class="clear"></div></section></main><script>
const questions=[
['61. የማሽከርከር ሁኔታን ከመንገድ ተጠቃሚዎች አንፃር መቃኘት የአዕምሮ ደህንነት መገለጫ ነው?', ['ሀ. እውነት','ለ. ሀሰት'],0],
['62. የክህሎታዊ ደህንነት ጉድለት መገለጫ የሆነውን ለይ?', ['ሀ. የትራንስፖርት ህጎችን አለማክበር','ለ. የመንገድ ተጠቃሚዎች በተሳሳተ ሁኔታ እንዲሄዱ ማድረግ','ሐ. አደገኛ የማሽከርከር ሂደትን መከተል','መ. በሌላ ሀሳብ ተጠምዶ ማሽከርከር'],2],
['63. በሐኪም የታዘዙ መድሃኒቶችን ከማሽከርከር ጋር ያላቸውን ዝምድና በመረዳት መጠቀም ተገቢ ነው?', ['ሀ. እውነት','ለ. ሀሰት'],0],
['64. አልኮል ጠጥተው የሚያሽከረክሩ አሽከርካሪዎች ሲያጋጥሙ ለህግ ክፍል ማሳወቅ ተገቢ ነው?', ['ሀ. እውነት','ለ. ሀሰት'],0],
['65. ከሚከተሉት ለሞገደኛ አነዳድ ምክንያት የሆነውን ለይ?', ['ሀ. ትኩረት ባለመስጠት ማሽከርከር','ለ. የአነዳድ ስህተቶችን ልምድ ማድረግ','ሐ. በጭንቀት ውስጥ ሆኖ ማሽከርከር','መ. ሁሉም'],3],
['66. ረድፍን ላለመልቀቅ ፉክክር ውስጥ መግባት ሞገደኛ አሽከርካሪ ሲያጋጥም መደረግ ከሚገባቸው አንዱ ነው?', ['ሀ. እውነት','ለ. ሀሰት'],1],
['67. ከማሽከርከር ባህሪያት ውስጥ የማይመደበውን ለይ?', ['ሀ. አዕምሮአዊ ባህሪ','ሐ. የመገንዘብ ባህሪ','ለ. የስሜት ባህሪ','መ. የክህሎት ባህሪ'],1],
['68. ከሚከተሉት መረዳትን፣ ማሰብንና ውሳኔ መስጠትን ያካተተ የትኛው ነው?', ['ሀ. የክህሎት ባህሪ','ሐ. የመገንዘብ ባህሪ','ለ. የስሜት ባህሪ','መ. መልሱ የለም'],1],
['69. የክህሎት ባህሪ ፍላጎትን፣ አመለካከትንና መነሳሳትን ያካተተ ነው?', ['ሀ. እውነት','ለ. ሀሰት'],1],
['70. ለሌሎች የመንገድ ተጠቃሚዎች ማሰብና ስነ-ምግባራዊነት የ_____መገለጫ ነው?', ['ሀ. ክህሎታዊ ሃላፊነት','ሐ. ስሜታዊ ብቃት','ለ. ስሜታዊ ደህንነት','መ. ስሜታዊ ሃላፊነት'],3]
];let i=0,s=0,answered=false;const $=id=>document.getElementById(id);function show(){answered=false;const q=questions[i];$('progress').textContent=`ጥያቄ ${i+1} ከ ${questions.length}`;$('bar').style.width=`${(i+1)/questions.length*100}%`;$('question').textContent=q[0];$('options').innerHTML='';$('feedback').textContent='';$('feedback').className='feedback';$('next').classList.add('hidden');q[1].forEach((x,n)=>{const b=document.createElement('button');b.className='option';b.textContent=x;b.onclick=()=>answer(n);$('options').append(b)})}function answer(n){if(answered)return;answered=true;const q=questions[i],bs=[...$('options').children];bs.forEach(b=>b.disabled=true);bs[q[2]].classList.add('correct');if(n===q[2]){s++;$('feedback').textContent='ትክክል መልስ!';$('feedback').classList.add('good')}else{bs[n].classList.add('wrong');$('feedback').textContent=`የተሳሳተ መልስ። ትክክለኛው፦ ${q[1][q[2]]}`;$('feedback').classList.add('bad')}$('next').textContent=i===questions.length-1?'ውጤት አሳይ':'ቀጣይ ጥያቄ';$('next').classList.remove('hidden')}$('next').onclick=()=>{i++;if(i<questions.length)show();else{$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=`ውጤትዎ፦ ${s} / ${questions.length}`}};$('restart').onclick=()=>{i=0;s=0;$('result').classList.add('hidden');$('quiz').classList.remove('hidden');show()};show();
</script></body></html>
