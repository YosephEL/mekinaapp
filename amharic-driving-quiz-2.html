<!doctype html>
<html lang="am">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>የመንጃ ፈተና ኩዊዝ 2</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap');
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:#172033;background:linear-gradient(135deg,#e9f5ff,#f6f9fc);font-family:"Noto Sans Ethiopic",Arial,sans-serif}.card{width:min(100%,720px);padding:clamp(24px,5vw,44px);border-radius:22px;background:#fff;box-shadow:0 18px 50px #1d3e6326}h1{color:#123e72;margin:0 0 8px;font-size:clamp(1.4rem,4vw,2rem)}.muted{color:#596579;margin:0}.bar{height:8px;background:#e8edf3;border-radius:9px;overflow:hidden;margin:22px 0 28px}.bar div{height:100%;background:#2382d7;transition:.25s;width:0}.question{font-size:clamp(1.15rem,3vw,1.45rem);line-height:1.7;margin:18px 0}.options{display:grid;gap:12px}.option{border:2px solid #dce5ef;border-radius:12px;background:#fff;padding:16px 18px;text-align:left;font:inherit;font-size:1rem;color:#172033;cursor:pointer;transition:.18s}.option:hover:not(:disabled){border-color:#2382d7;background:#f2f8ff}.option:disabled{cursor:default}.correct{border-color:#1d9a63;background:#eaf8f1;color:#08633a}.wrong{border-color:#d65050;background:#fff0f0;color:#a32424}.feedback{min-height:30px;font-weight:600;margin:18px 0 0}.good{color:#087244}.bad{color:#b22b2b}.next{float:right;margin-top:14px;border:0;border-radius:10px;background:#176fbd;color:white;padding:12px 22px;font:inherit;font-weight:600;cursor:pointer}.hidden{display:none}.clear{clear:both}.result{text-align:center}.result h2{color:#123e72}.result p{font-size:1.2rem}
  </style>
</head>
<body><main class="card" aria-live="polite">
  <section id="quiz"><h1>የመንጃ ፈተና ኩዊዝ 2</h1><p class="muted">እያንዳንዱን ጥያቄ በተናጠል ይመልሱ።</p><div class="bar"><div id="bar"></div></div><p id="progress" class="muted"></p><h2 id="question" class="question"></h2><div id="options" class="options"></div><p id="feedback" class="feedback"></p><button id="next" class="next hidden"></button><div class="clear"></div></section>
  <section id="result" class="result hidden"><h2>ኩዊዙን ጨርሰዋል!</h2><p id="score"></p><button id="restart" class="next">እንደገና ጀምር</button><div class="clear"></div></section>
</main>
<script>
const questions=[
 {q:'11. በማሽከርከር ወቅት ለማድረግ ያሰብነውን ለሌሎች የመንገድ ተጠቃሚዎች ማሳወቅ ራስን ከአደጋ ለመከላከል ይጠቅማል?',a:['ሀ. እውነት','ለ. ሀሰት'],c:0},
 {q:'12. ለረዥም ጉዞ መደረግ ያለበትን ጥንቃቄ ለይ?',a:['ሀ. መረጃን መሰብሰብ','ለ. የተሽከርካሪ ውስጥ ህግን ማዘጋጀት','ሐ. የዕለት ጉዞ መመዝገቢያ ፎርም ማዘጋጀት','መ. ሁሉም'],c:3},
 {q:'14. የአንድ ጠንቃቃ የህዝብ ማመላለሻ አሽከርካሪ ባህሪ የሆነውን ለይ?',a:['ሀ. የጉዞ ዕቅድ እና ካርታ ማዘጋጀት','ለ. የተጓዦችን እድሜ እና ፍላጎት ለይቶ መረዳት','ሐ. የሚጫኑ ዕቃዎችን አይነት በመለየት መጫን'],c:1},
 {q:'15. በጣም ለመውረድ የቸኮሉ መንገደኞችን ፍጥነት ቀንሶ ተሽከርካሪ ሳይቆም ማውረድ ይቻላል?',a:['ሀ. እውነት','ለ. ሀሰት'],c:1},
 {q:'16. የሞተር ዙርን በደቂቃ የሚለካ መሳሪያ ይባላል?',a:['ሀ. ኦዶ ሜትር','ሐ. ታኮ ሜትር','ለ. ስፒዶ ሜትር','መ. ሁሉም'],c:1},
 {q:'17. ሲሊንደር ሄድ ከሞተር ከታች የሚገኝና የማለስለሻ ዘይት የሚይዝ ክፍል ነው?',a:['ሀ. እውነት','ለ. ሀሰት'],c:1},
 {q:'18. እግረኛ በማይበዛባቸው የእግረኛ ማቋረጫ መስመሮች ላይ ተሽከርካሪን ማቆም ይቻላል?',a:['ሀ. እውነት','ለ. ሀሰት'],c:1},
 {q:'19. በወጣ ገባ መንገዶች ላይ በፍጥነት ማሽከርከር የመሪን ቅልጥፍና ይጨምራል?',a:['ሀ. እውነት','ለ. ሀሰት'],c:1},
 {q:'20. በዊል ሲሊንደር ውስጥ የሚገኙ ሲሎች መበላሸት ለፍሬን ብቃት መቀነስ ምክንያት ነው?',a:['ሀ. እውነት','ለ. ሀሰት'],c:0}
];
let i=0,score=0,done=false;const $=id=>document.getElementById(id);
function render(){done=false;let x=questions[i];$('progress').textContent=`ጥያቄ ${i+1} ከ ${questions.length}`;$('bar').style.width=`${(i+1)/questions.length*100}%`;$('question').textContent=x.q;$('feedback').textContent='';$('feedback').className='feedback';$('next').classList.add('hidden');$('options').innerHTML='';x.a.forEach((v,n)=>{let b=document.createElement('button');b.className='option';b.textContent=v;b.onclick=()=>choose(n);$('options').append(b)})}
function choose(n){if(done)return;done=true;let x=questions[i],b=[...$('options').children];b.forEach(v=>v.disabled=true);b[x.c].classList.add('correct');if(n===x.c){score++;$('feedback').textContent='ትክክል መልስ!';$('feedback').classList.add('good')}else{b[n].classList.add('wrong');$('feedback').textContent=`የተሳሳተ መልስ። ትክክለኛው፦ ${x.a[x.c]}`;$('feedback').classList.add('bad')}$('next').textContent=i===questions.length-1?'ውጤት አሳይ':'ቀጣይ ጥያቄ';$('next').classList.remove('hidden')}
$('next').onclick=()=>{i++;if(i<questions.length)render();else{$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=`ውጤትዎ፦ ${score} / ${questions.length}`}};$('restart').onclick=()=>{i=0;score=0;$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()};render();
</script></body></html>
