<!doctype html>
<html lang="am">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>የመንጃ ፈተና ኩዊዝ 3</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap');*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#e9f5ff,#f6f9fc);color:#172033;font-family:"Noto Sans Ethiopic",Arial,sans-serif}.card{width:min(100%,720px);padding:clamp(24px,5vw,44px);background:#fff;border-radius:22px;box-shadow:0 18px 50px #1d3e6326}h1{margin:0 0 8px;color:#123e72;font-size:clamp(1.4rem,4vw,2rem)}.muted{margin:0;color:#596579}.bar{height:8px;margin:22px 0 28px;background:#e8edf3;border-radius:9px;overflow:hidden}.bar div{height:100%;width:0;background:#2382d7;transition:.25s}.question{margin:18px 0;font-size:clamp(1.15rem,3vw,1.45rem);line-height:1.7}.options{display:grid;gap:12px}.option{padding:16px 18px;border:2px solid #dce5ef;border-radius:12px;background:#fff;color:#172033;text-align:left;font:inherit;font-size:1rem;cursor:pointer}.option:hover:not(:disabled){border-color:#2382d7;background:#f2f8ff}.option:disabled{cursor:default}.correct{border-color:#1d9a63;background:#eaf8f1;color:#08633a}.wrong{border-color:#d65050;background:#fff0f0;color:#a32424}.feedback{min-height:30px;margin:18px 0 0;font-weight:600}.good{color:#087244}.bad{color:#b22b2b}.next{float:right;margin-top:14px;padding:12px 22px;border:0;border-radius:10px;background:#176fbd;color:#fff;font:inherit;font-weight:600;cursor:pointer}.hidden{display:none}.clear{clear:both}.result{text-align:center}.result h2{color:#123e72}.result p{font-size:1.2rem}</style>
</head>
<body><main class="card" aria-live="polite"><section id="quiz"><h1>የመንጃ ፈተና ኩዊዝ 3</h1><p class="muted">እያንዳንዱን ጥያቄ በተናጠል ይመልሱ።</p><div class="bar"><div id="bar"></div></div><p id="progress" class="muted"></p><h2 id="question" class="question"></h2><div id="options" class="options"></div><p id="feedback" class="feedback"></p><button id="next" class="next hidden"></button><div class="clear"></div></section><section id="result" class="result hidden"><h2>ኩዊዙን ጨርሰዋል!</h2><p id="score"></p><button id="restart" class="next">እንደገና ጀምር</button><div class="clear"></div></section></main>
<script>
const questions=[
{q:'21. የተሽከርካሪ ክብደት ሲጨምር ሰበቃ ይቀንሳል?',a:['ሀ. እውነት','ለ. ሀሰት'],c:1},
{q:'22. ቀላል ማርሽን በቁልቁለት ላይ መጠቀም አደጋን ለመቀነስ ከፍተኛ አስተዋፅዖ አለው?',a:['ሀ. እውነት','ለ. ሀሰት'],c:0},
{q:'23. ተሽከርካሪን ለመቅደም ማሳየት የሚገባን የፍሬቻ አበራር ቅደም ተከተል መጀመሪያ ቀጥሎ ነው?',a:['ሀ. የግራ እና የቀኝ','ሐ. የቀኝ ብቻ','ለ. የቀኝ እና የግራ','መ. መልሱ የለም'],c:0},
{q:'24. የፍሪሲዮን ፔዳልን የምንጠቀመው መቼ ነው?',a:['ሀ. ማርሽ ስንለውጥ','ሐ. ፍጥነት ለመጨመር','ለ. ሞተር ስናስነሳ','መ. መልሱ የለም'],c:0},
{q:'25. ከሚከተሉት ለትራፊክ አደጋ መንስኤ የሆነውን ለይ?',a:['ሀ. የአሽከርካሪ ባህሪ','ለ. የተሽከርካሪ ባህሪ','ሐ. የአካባቢ ተፅዕኖ','መ. ሁሉም መልስ ናቸው'],c:3},
{q:'26. ከወረዳ ወረዳ የሚደረግ የጉዞ አይነት መካከለኛ ጉዞ ይባላል?',a:['ሀ. እውነት','ለ. ሀሰት'],c:0},
{q:'27. ረዥም የጉዞ አይነት የሚባለውን ለይ?',a:['ሀ. ከክልል ወደ ክልል የሚደረግ ጉዞ','ለ. ከወረዳ ወረዳ የሚደረግ ጉዞ','ሐ. ከሀገር ሀገር የሚደረግ ጉዞ','መ. ሀ እና ሐ መልስ ናቸው'],c:3},
{q:'28. ማስተር ሲሊንደር ከፍተኛ ግፊት የሚፈጠርበት የፍሬን ክፍል ነው?',a:['ሀ. እውነት','ለ. ሀሰት'],c:0},
{q:'29. የፊት ጎማ መንሸራተትን ለመቆጣጠር ብቸኛው መንገድ?',a:['ሀ. ጥርስ ያለው ጎማ መጠቀም','ለ. የመንገድን እና የአየር ፀባይ በመቆጣጠር ማሽከርከር','ሒ. የተሽከርካሪን ፍጥነት መቀነስ','መ. ሁሉም'],c:3},
{q:'30. 5ቱ “መ” ዎች ከሚባሉት መካከል ያልሆነውን ለይ?',a:['ሀ. መለየት','ሊ. መጠየቅ','ሐ. መገመት','መ. መተግበር'],c:2}
];let i=0,score=0,done=false;const $=x=>document.getElementById(x);function render(){done=false;const x=questions[i];$('progress').textContent=`ጥያቄ ${i+1} ከ ${questions.length}`;$('bar').style.width=`${(i+1)/questions.length*100}%`;$('question').textContent=x.q;$('options').innerHTML='';$('feedback').textContent='';$('feedback').className='feedback';$('next').classList.add('hidden');x.a.forEach((v,n)=>{let b=document.createElement('button');b.className='option';b.textContent=v;b.onclick=()=>choose(n);$('options').append(b)})}function choose(n){if(done)return;done=true;const x=questions[i],b=[...$('options').children];b.forEach(v=>v.disabled=true);b[x.c].classList.add('correct');if(n===x.c){score++;$('feedback').textContent='ትክክል መልስ!';$('feedback').classList.add('good')}else{b[n].classList.add('wrong');$('feedback').textContent=`የተሳሳተ መልስ። ትክክለኛው፦ ${x.a[x.c]}`;$('feedback').classList.add('bad')}$('next').textContent=i===questions.length-1?'ውጤት አሳይ':'ቀጣይ ጥያቄ';$('next').classList.remove('hidden')}$('next').onclick=()=>{i++;if(i<questions.length)render();else{$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=`ውጤትዎ፦ ${score} / ${questions.length}`}};$('restart').onclick=()=>{i=0;score=0;$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()};render();
</script></body></html>
