<!doctype html>
<html lang="am" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>የመንጃ ፈተና ኩዊዝ</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #172033; background: linear-gradient(135deg, #e9f5ff, #f6f9fc); font-family: "Noto Sans Ethiopic", Arial, sans-serif; }
    .quiz { width: min(100%, 720px); background: #fff; padding: clamp(24px, 5vw, 44px); border-radius: 22px; box-shadow: 0 18px 50px rgba(29, 62, 99, .15); }
    h1 { margin: 0 0 8px; color: #123e72; font-size: clamp(1.45rem, 4vw, 2rem); }
    .subtitle, .progress { color: #596579; margin: 0; }
    .bar { height: 8px; background: #e8edf3; border-radius: 8px; overflow: hidden; margin: 23px 0 30px; }
    .bar > div { height: 100%; width: 10%; background: #2382d7; border-radius: inherit; transition: width .25s ease; }
    .question { font-size: clamp(1.18rem, 3vw, 1.48rem); font-weight: 600; line-height: 1.7; margin: 0 0 22px; }
    .options { display: grid; gap: 12px; }
    button.option { border: 2px solid #dce5ef; cursor: pointer; text-align: left; background: #fff; border-radius: 12px; padding: 16px 18px; font: inherit; font-size: 1rem; color: #172033; transition: .18s; }
    button.option:hover:not(:disabled) { border-color: #2382d7; background: #f2f8ff; transform: translateY(-1px); }
    button.option:disabled { cursor: default; }
    button.correct { border-color: #1d9a63; background: #eaf8f1; color: #08633a; }
    button.wrong { border-color: #d65050; background: #fff0f0; color: #a32424; }
    .feedback { min-height: 32px; margin: 20px 0 0; font-weight: 600; }
    .feedback.good { color: #087244; } .feedback.bad { color: #b22b2b; }
    #next, #restart { margin-top: 14px; float: right; border: 0; background: #176fbd; color: #fff; border-radius: 10px; padding: 12px 22px; cursor: pointer; font: inherit; font-weight: 600; }
    #next:hover, #restart:hover { background: #105b9e; }
    .hidden { display: none; }
    .result { text-align: center; padding: 12px 0; }
    .result h2 { color: #123e72; }
    .result p { font-size: 1.2rem; }
    .result button { float: none !important; }
    .clear { clear: both; }
  </style>
</head>
<body>
  <main class="quiz" aria-live="polite">
    <section id="quizScreen">
      <h1><a href="https://yosephel.github.io/mekinaapp/">የመንጃ ፈተና ኩዊዞች</a></h1>
      <p class="subtitle">እያንዳንዱን ጥያቄ በተናጠል ይመልሱ።</p>
      <div class="bar" aria-hidden="true"><div id="bar"></div></div>
      <p id="progress" class="progress"></p>
      <h2 id="question" class="question"></h2>
      <div id="options" class="options"></div>
      <p id="feedback" class="feedback"></p>
      <button id="next" class="hidden">ቀጣይ ጥያቄ</button>
      <div class="clear"></div>
    </section>
    <section id="resultScreen" class="result hidden">
      <h2>ኩዊዙን ጨርሰዋል!</h2>
            <h2><a href="https://yosephel.github.io/mekinaapp/">የመንጃ ፈተና ኩዊዞች</a></h2>

      <p id="score"></p>
      <button id="restart">እንደገና ጀምር</button>
    </section>
  </main>
  <script>
    const questions = [
      { q: '1. አውቶማቲክ ትራንስሚሽን የሆነ ተሽከርካሪ ወደ ኋላ ለመሄድ ማርሽን “P” ላይ ማድረግ ያስፈልጋል?', a: ['ሀ. እውነት', 'ለ. ሀሰት'], correct: 1 },
      { q: '2. በአውቶሞቢል ውስጥ መያዝ ያለበትን የእሳት ማጥፊያ ለይ?', a: ['1. ኤኤኤስ ዲ', 'Λ. A እና B', 'ሐ. B እና C', 'መ. መልሱ የለም'], correct: 2 },
      { q: '3. ደንብ ማክበር እና ልበሙሉነት የስሜታዊ ብቃት መገለጫ ነው?', a: ['ሀ. እውነት', 'ለ. ሀሰት'], correct: 0 },
      { q: '4. ዓለም አቀፍ የትራፊክ ማስተላለፊያ መብራቶች በአራት ይከፈላሉ?', a: ['ሀ. እውነት', 'ለ. ሀሰት'], correct: 1 },
      { q: '5. ከዓለም አቀፍ የመንገድ ዳር ምልክቶች ውስጥ የማይመደበውን ለይ?', a: ['ሀ. የሚያስጠነቅቁ', 'ሐ. የሚያስገድዱ', 'ሊ. የሚቆጣጠሩ', 'መ. መልሱ የለም'], correct: 3 },
      { q: '6. ቀይ የእግረኛ ምስል ያለበት መብራት ሲበራ እግረኞች መንገድ በፍጥነት እንዲያቋርጡ ይመከራል?', a: ['ሀ. እውነት', 'ለ. ሀሰት'], correct: 1 },
      { q: '7. ዲፈረንሻል በቀጥታ መንገዶች ላይ ለአክስሎች እኩል ኃይል ያስተላልፋል?', a: ['ሀ. እውነት', 'ለ. ሀሰት'], correct: 0 },
      { q: '8. ከሞተር ብስክሌት የአሽከርካሪ የደህንነት ልብስ መካከል ያልሆነውን ለይ?', a: ['ሀ. የራስ ቆብ', 'ለ. የእጅ ጓንት', 'ሐ. ጎማ', 'መ. መልሱ የለም'], correct: 2 },
      { q: '9. የሚያንሸራትት መንገድ መኖሩን የሚገልጽ ምልክት ከሚያስገድዱ ምልክቶች ውስጥ ይመደባል?', a: ['ሀ. እውነት', 'ለ. ሀሰት'], correct: 1 },
      { q: '10. ከሚከተሉት ውስጥ የሞተር ብስክሌት ላይ ከመውጣታችን በፊት የሚደረገውን ፍተሻ ለይ?', a: ['ሀ. ፍሪሲዮንን መፈተሽ', 'ሐ. ዘይቶችን መፈተሽ', 'ለ. ፍሬንን መፈተሽ', 'መ. መልሱ የለም'], correct: 3 }
    ];
    let index = 0, score = 0, answered = false;
    const $ = id => document.getElementById(id);
    function render() {
      answered = false;
      const item = questions[index];
      $('progress').textContent = `ጥያቄ ${index + 1} ከ ${questions.length}`;
      $('bar').style.width = `${((index + 1) / questions.length) * 100}%`;
      $('question').textContent = item.q;
      $('options').innerHTML = '';
      $('feedback').textContent = '';
      $('feedback').className = 'feedback';
      $('next').classList.add('hidden');
      item.a.forEach((answer, choice) => {
        const btn = document.createElement('button');
        btn.className = 'option'; btn.textContent = answer;
        btn.onclick = () => choose(choice);
        $('options').appendChild(btn);
      });
    }
    function choose(choice) {
      if (answered) return;
      answered = true;
      const item = questions[index];
      const buttons = [...$('options').children];
      buttons.forEach(b => b.disabled = true);
      buttons[item.correct].classList.add('correct');
      if (choice === item.correct) {
        score++; $('feedback').textContent = 'ትክክል መልስ!'; $('feedback').classList.add('good');
      } else {
        buttons[choice].classList.add('wrong'); $('feedback').textContent = `የተሳሳተ መልስ። ትክክለኛው፦ ${item.a[item.correct]}`; $('feedback').classList.add('bad');
      }
      $('next').textContent = index === questions.length - 1 ? 'ውጤት አሳይ' : 'ቀጣይ ጥያቄ';
      $('next').classList.remove('hidden');
    }
    $('next').onclick = () => {
      index++;
      if (index < questions.length) render();
      else { $('quizScreen').classList.add('hidden'); $('resultScreen').classList.remove('hidden'); $('score').textContent = `ውጤትዎ፦ ${score} / ${questions.length}`; }
    };
    $('restart').onclick = () => { index = 0; score = 0; $('resultScreen').classList.add('hidden'); $('quizScreen').classList.remove('hidden'); render(); };
    render();
  </script>
</body>
</html>
