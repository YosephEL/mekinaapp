<!doctype html><html lang="am"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>የመንጃ ፈተና ኩዊዝ 19</title><style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap');*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#e9f5ff,#f6f9fc);color:#172033;font-family:"Noto Sans Ethiopic",Arial,sans-serif}.card{width:min(100%,720px);padding:clamp(24px,5vw,44px);background:#fff;border-radius:22px;box-shadow:0 18px 50px #1d3e6326}h1{margin:0 0 8px;color:#123e72;font-size:clamp(1.4rem,4vw,2rem)}.muted{margin:0;color:#596579}.bar{height:8px;margin:22px 0 28px;background:#e8edf3;border-radius:9px;overflow:hidden}.bar div{height:100%;background:#2382d7;transition:.25s}.question{margin:18px 0;font-size:clamp(1.15rem,3vw,1.45rem);line-height:1.7}.options{display:grid;gap:12px}.option{padding:16px 18px;border:2px solid #dce5ef;border-radius:12px;background:#fff;color:#172033;text-align:left;font:inherit;font-size:1rem;cursor:pointer}.option:hover:not(:disabled){border-color:#2382d7;background:#f2f8ff}.option:disabled{cursor:default}.correct{border-color:#1d9a63;background:#eaf8f1;color:#08633a}.wrong{border-color:#d65050;background:#fff0f0;color:#a32424}.feedback{min-height:30px;margin:18px 0 0;font-weight:600}.good{color:#087244}.bad{color:#b22b2b}.next{float:right;margin-top:14px;padding:12px 22px;border:0;border-radius:10px;background:#176fbd;color:#fff;font:inherit;font-weight:600;cursor:pointer}.hidden{display:none}.clear{clear:both}.result{text-align:center}.result h2{color:#123e72}.result p{font-size:1.2rem}</style></head><body><main class="card" aria-live="polite"><section id="quiz"><h1>የመንጃ ፈተና ኩዊዝ 19</h1><p class="muted">እያንዳንዱን ጥያቄ በተናጠል ይመልሱ።</p><div class="bar"><div id="bar"></div></div><p id="progress" class="muted"></p><h2 id="question" class="question"></h2><div id="options" class="options"></div><p id="feedback" class="feedback"></p><button id="next" class="next hidden"></button><div class="clear"></div></section><section id="result" class="result hidden"><h2>ኩዊዙን ጨርሰዋል!</h2>
<h2><a href="https://yosephel.github.io/mekinaapp/">የመንጃ ፈተና ኩዊዞች</a></h2><p id="score"></p><button id="restart" class="next">እንደገና ጀምር</button><div class="clear"></div></section></main><script>
const questions=[
['181. ቫኪውም ቫልቭ በአነስተኛ ግፊት ውሃ እንዳይባክንና በሙቀት አማካኝነት የተፈጠረን ግፊት ለማስወጣት ያግዛል?', ['ሀ. እውነት','ለ. ሀሰት'],1],
['182. በባድ ቦታ መፈጠር ምክንያት ራዲያተር እንዳይጨማደድ ፕሬዠር ቫልቭ በመከፈት ውሃን ወደ ራዲያተር ያስገባል?', ['ሀ. እውነት','ለ. ሀሰት'],1],
['183. አስገቢ ቫልቮች በመከፈት የተቃጠለ ጭስን ከሞተር ለማስወጣት ያግዛሉ?', ['ሀ. እውነት','ለ. ሀሰት'],1],
['184. ሞተር ከመጥፋቱ በፊት ለተወሰነ ደቂቃ በሚኒሞ እንዲሰራ ማድረግ ለአየር ብክለት ከፍተኛ አስተዋፅዖ አለው?', ['ሀ. እውነት','ለ. ሀሰት'],1],
['188. ሞተር እንደተነሳ የነዳጅ ፔዳልን ቶሎ ቶሎ በመጫን ሞተርን ማሞቅ ተገቢ ነው?', ['ሀ. እውነት','ለ. ሀሰት'],1],
['186. ከሚከተሉት የሞተር ኃይል አጋዥ ዘዴ ያልሆነውን ለይ?', ['ሀ. ጭስን የማስወጣት ዘዴ','ሐ. የማቀዝቀዣ ዘዴ','ለ. የባትሪ መሙያ ዘዴ','መ. የማለስለሻ ዘዴ'],2],
['187. የቤንዚን ሞተር ነዳጅ አስተላላፊ ክፍል ያልሆነውን ለይ?', ['ሀ. ፊድ ፓምፕ','ሐ. ኢንጀክሽን ኖዝል','ለ. ኢንጀክሽን ፓምፕ','መ. ሁሉም'],3],
['188 (ተጨማሪ). ነዳጅን ከታንከር ወደ ካርቡሬተር በግፊት የሚያስተላልፍ ክፍል ይባላል?', ['ሀ. ቾክ ቫልቭ','ለ. ኢንጀክሽን ፓምፕ','ሐ. የነዳጅ ፓምፕ','መ. “ለ” እና “ሐ” መልስ ናቸው'],2],
['189. የአየር ማጣሪያ ወደ ሞተር የሚገባን አየርና ነዳጅ ያጣራል?', ['ሀ. እውነት','ለ. ሀሰት'],1],
['190. ክራንክሻፍት ኃይልን ወደ ሞተር ክፍሎች ከሚያስተላልፍበት ዘዴ መካከል ያልሆነውን ለይ?', ['ሀ. በጊር (ጥርሶች)','ሐ. በሰንሰለት','ለ. በቤልት','መ. መልሱ የለም'],3]
];let i=0,s=0,answered=false;const $=id=>document.getElementById(id);function show(){answered=false;const q=questions[i];$('progress').textContent=`ጥያቄ ${i+1} ከ ${questions.length}`;$('bar').style.width=`${(i+1)/questions.length*100}%`;$('question').textContent=q[0];$('options').innerHTML='';$('feedback').textContent='';$('feedback').className='feedback';$('next').classList.add('hidden');q[1].forEach((x,n)=>{const b=document.createElement('button');b.className='option';b.textContent=x;b.onclick=()=>answer(n);$('options').append(b)})}function answer(n){if(answered)return;answered=true;const q=questions[i],bs=[...$('options').children];bs.forEach(b=>b.disabled=true);bs[q[2]].classList.add('correct');if(n===q[2]){s++;$('feedback').textContent='ትክክል መልስ!';$('feedback').classList.add('good')}else{bs[n].classList.add('wrong');$('feedback').textContent=`የተሳሳተ መልስ። ትክክለኛው፦ ${q[1][q[2]]}`;$('feedback').classList.add('bad')}$('next').textContent=i===questions.length-1?'ውጤት አሳይ':'ቀጣይ ጥያቄ';$('next').classList.remove('hidden')}$('next').onclick=()=>{i++;if(i<questions.length)show();else{$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=`ውጤትዎ፦ ${s} / ${questions.length}`}};$('restart').onclick=()=>{i=0;s=0;$('result').classList.add('hidden');$('quiz').classList.remove('hidden');show()};show();
</script></body></html>
