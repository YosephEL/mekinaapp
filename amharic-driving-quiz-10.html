<!doctype html><html lang="am"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>የመንጃ ፈተና ኩዊዝ 10</title><style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap');*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#e9f5ff,#f6f9fc);color:#172033;font-family:"Noto Sans Ethiopic",Arial,sans-serif}.card{width:min(100%,720px);padding:clamp(24px,5vw,44px);background:#fff;border-radius:22px;box-shadow:0 18px 50px #1d3e6326}h1{margin:0 0 8px;color:#123e72;font-size:clamp(1.4rem,4vw,2rem)}.muted{margin:0;color:#596579}.bar{height:8px;margin:22px 0 28px;background:#e8edf3;border-radius:9px;overflow:hidden}.bar div{height:100%;background:#2382d7;transition:.25s}.question{margin:18px 0;font-size:clamp(1.15rem,3vw,1.45rem);line-height:1.7}.options{display:grid;gap:12px}.option{padding:16px 18px;border:2px solid #dce5ef;border-radius:12px;background:#fff;color:#172033;text-align:left;font:inherit;font-size:1rem;cursor:pointer}.option:hover:not(:disabled){border-color:#2382d7;background:#f2f8ff}.option:disabled{cursor:default}.correct{border-color:#1d9a63;background:#eaf8f1;color:#08633a}.wrong{border-color:#d65050;background:#fff0f0;color:#a32424}.feedback{min-height:30px;margin:18px 0 0;font-weight:600}.good{color:#087244}.bad{color:#b22b2b}.next{float:right;margin-top:14px;padding:12px 22px;border:0;border-radius:10px;background:#176fbd;color:#fff;font:inherit;font-weight:600;cursor:pointer}.hidden{display:none}.clear{clear:both}.result{text-align:center}.result h2{color:#123e72}.result p{font-size:1.2rem}</style></head><body><main class="card" aria-live="polite"><section id="quiz"><h1>የመንጃ ፈተና ኩዊዝ 10</h1><p class="muted">እያንዳንዱን ጥያቄ በተናጠል ይመልሱ።</p><div class="bar"><div id="bar"></div></div><p id="progress" class="muted"></p><h2 id="question" class="question"></h2><div id="options" class="options"></div><p id="feedback" class="feedback"></p><button id="next" class="next hidden"></button><div class="clear"></div></section><section id="result" class="result hidden"><h2>ኩዊዙን ጨርሰዋል!</h2>
            <h2><a href="https://yosephel.github.io/mekinaapp/">የመንጃ ፈተና ኩዊዞች</a></h2>
<p id="score"></p><button id="restart" class="next">እንደገና ጀምር</button><div class="clear"></div></section></main><script>
const questions=[
['87. የአልኮል መጠጥ ጠጥተው የሚያሽከረክሩ አሽከርካሪዎች ከሚያሳዩዋቸው ባህሪያት መካከል ያልሆነውን ለይ?', ['ሀ. ተሽከርካሪን በጣም ተጠግቶ ማሽከርከር','ለ. በከፍተኛ ፍጥነት ማሽከርከር','ሐ. ምልክቶችን ማክበር','መ. በጣም ዝግ ባለ ፍጥነት ማሽከርከር'],2],
['88. የማሽከርከር ብቃትን ሳይንሳዊ በሆነ መንገድ መገምገም የ_____መገለጫ ነው?', ['ሀ. አዕምሮአዊ ሃላፊነት','ለ. ክህሎታዊ ደህንነት','ሐ. ስሜታዊ ብቃት','መ. ክህሎታዊ ብቃት'],3],
['89. ሞገደኛ አሽከርካሪነት በተደጋጋሚ በመጥፎ ስሜት ውስጥ ሆኖ የማሽከርከር ውጤት ነው?', ['ሀ. እውነት','ለ. ሀሰት'],0],
['90. ሞገደኛ አሽከርካሪ ሲያጋጥም ነገሮችን በተረጋጋ ስሜት መመልከት የ_____መገለጫ ነው?', ['ሀ. ክህሎታዊ ደህንነት','ሐ. አዕምሮአዊ ደህንነት','ለ. ስሜታዊ ደህንነት','መ. ስሜታዊ ብቃት'],2],
['91. ለመንገድ ተጠቃሚዎች ሚዛናዊ ለመሆን መሞከር የ_____መገለጫ ነው?', ['ሀ. አዕምሮአዊ ደህንነት','ሒ. ስሜታዊ ሃላፊነት','ለ. ክህሎታዊ ደህንነት','መ. ስሜታዊ ደህንነት'],1],
['92. መልካሙንና መጥፎውን በመለየት መልካሙን እንድንከተል የሚያበረታታ እሴት ይባላል?', ['ሀ. ባህሪ','ሐ. ሰነ-ምግባር','ለ. ስነ-ባህሪ','መ. ሙያዊ ስነ-ምግባር'],1],
['93. ባለሙያዎች የተሰማሩበት ሙያ የሚጠይቀው መልካም ምግባርና ስነ-ስርዓት ሙያዊ ስነ-ምግባር ይባላል?', ['ሀ. እውነት','ለ. ሀሰት'],0],
['94. ለትራፊክ ህግና ደንቦች ተገቢውን ምላሽ መስጠት ከማሽከርከር ሙያዊ ስነ-ምግባር አይመደብም?', ['ሀ. እውነት','ለ. ሀሰት'],1],
['95. ለአላስፈላጊ የማሽከርከር ባህሪ የሚያጋልጡ ነገሮችን ለማስወገድ ከሚረዱ ዘዴዎች መካከል ያልሆነውን ለይ?', ['ሀ. ጠጥቶ ማሽከርከር','ሐ. ውጤታማ መግባባትን መፍጠር','ለ. በጥሩ ስሜት ለማሽከርከር መሞከር','መ. ሁሉም መልስ ናቸው'],0],
['96. በማሽከርከር ሂደት ለሚፈጠሩ ስህተቶች በራስ ላይ መመስከር የማሽከርከር ስህተቶችን ልምድ ላለማድረግ ያግዛል?', ['ሀ. እውነት','ለ. ሀሰት'],0],
['97. በበቀል ስሜት በድንገት ፍሬን መያዝና ማቋረጥ የ_____መገለጫ ነው?', ['ሀ. ግዴለሽነትና የመንገድ ዳር ፀብ','ለ. ትዕግስት ማጣትና ትኩረት አለመስጠት','ሐ. የመንገድ ዳር ፀብ','መ. ተፅዕኖ የማድረግ ትግል'],2],
['98. ከሚከተሉት የሞገደኛ አሽከርካሪ መገለጫ ያልሆነውን ለይ?', ['ሀ. ትዕግስት ማጣትና ትኩረት አለመስጠት','ለ. ተፅዕኖ የማድረግ ትግል','ሐ. ግዴለሽነትና የመንገድ ዳር ፀብ','መ. መልሱ የለም'],3],
['99. የሰዎችንና የእንስሳትን ባህሪ ሳይንሳዊ በሆነ መንገድ የሚያጠና ይባላል?', ['ሀ. ባህሪ','ሐ. ሙያ','ለ. ስነ-ባህሪ','መ. ሙያዊ ስነ-ምግባር'],2],
['100. ባህሪ የአስተሳሰብ፣ አመለካከትና ድርጊት የጋራ ውጤት ነው?', ['ሀ. እውነት','ለ. ሀሰት'],0]
];let i=0,s=0,answered=false;const $=id=>document.getElementById(id);function show(){answered=false;const q=questions[i];$('progress').textContent=`ጥያቄ ${i+1} ከ ${questions.length}`;$('bar').style.width=`${(i+1)/questions.length*100}%`;$('question').textContent=q[0];$('options').innerHTML='';$('feedback').textContent='';$('feedback').className='feedback';$('next').classList.add('hidden');q[1].forEach((x,n)=>{const b=document.createElement('button');b.className='option';b.textContent=x;b.onclick=()=>answer(n);$('options').append(b)})}function answer(n){if(answered)return;answered=true;const q=questions[i],bs=[...$('options').children];bs.forEach(b=>b.disabled=true);bs[q[2]].classList.add('correct');if(n===q[2]){s++;$('feedback').textContent='ትክክል መልስ!';$('feedback').classList.add('good')}else{bs[n].classList.add('wrong');$('feedback').textContent=`የተሳሳተ መልስ። ትክክለኛው፦ ${q[1][q[2]]}`;$('feedback').classList.add('bad')}$('next').textContent=i===questions.length-1?'ውጤት አሳይ':'ቀጣይ ጥያቄ';$('next').classList.remove('hidden')}$('next').onclick=()=>{i++;if(i<questions.length)show();else{$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=`ውጤትዎ፦ ${s} / ${questions.length}`}};$('restart').onclick=()=>{i=0;s=0;$('result').classList.add('hidden');$('quiz').classList.remove('hidden');show()};show();
</script></body></html>
